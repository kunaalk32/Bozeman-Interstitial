<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#011627">
<meta name="robots" content="noindex">
<title>Bozeman Capital Partners is now Centuris Capital</title>
<meta name="description" content="Bozeman Capital Partners has changed its name to Centuris Capital. Our website has moved to centuriscapital.com.">
<meta property="og:title" content="Bozeman Capital Partners is now Centuris Capital">
<meta property="og:description" content="Our name has changed. Our website has moved to centuriscapital.com.">
<meta property="og:url" content="https://centuriscapital.com">
<meta property="og:type" content="website">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap">
<noscript><meta http-equiv="refresh" content="10;url=https://centuriscapital.com"></noscript>
<style>
  /* Values from the Centuris Capital brand tokens (brand/tokens.css) */
  :root {
    --brand: #011627;
    --on-brand: #F6F3EC;
    --on-brand-muted: #A9B3BF;
    --camel: #B4925E;
    --on-camel: #011627;
    --space-4: 16px;
    --space-6: 24px;
    --space-12: 48px;
    --radius-sm: 2px;
    --ease-settle: cubic-bezier(0.22, 1, 0.36, 1);
    --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    max-width: 1248px;
    margin: 0 auto;
    padding: var(--space-12) var(--space-6);
    background: var(--brand);
    color: var(--on-brand);
    font-family: var(--font-sans);
    font-size: 17px;
    line-height: 28px;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  html {
    background: var(--brand);
  }

  .wordmark {
    display: block;
    width: 240px;
    max-width: 100%;
    height: auto;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: var(--space-12) 0;
  }

  h1 {
    margin: 0;
    font-size: 32px;
    line-height: 38px;
    font-weight: 300;
    text-wrap: balance;
  }

  p {
    margin: var(--space-6) 0 0;
    color: var(--on-brand-muted);
    text-wrap: pretty;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-4) var(--space-6);
    margin-top: var(--space-12);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    background: var(--camel);
    color: var(--on-camel);
    font-size: 16px;
    line-height: 24px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color 300ms var(--ease-settle), transform 300ms var(--ease-settle);
  }

  .btn:focus-visible {
    outline: 2px solid var(--on-brand);
    outline-offset: 2px;
  }

  .btn:active {
    transform: scale(0.97);
    transition-duration: 100ms;
  }

  @media (hover: hover) {
    .btn:hover {
      background: color-mix(in srgb, var(--camel) 88%, var(--on-brand));
    }
  }

  .countdown {
    margin: 0;
    font-size: 14px;
    line-height: 22px;
    font-variant-numeric: tabular-nums;
  }

  @media (min-width: 480px) {
    h1 {
      font-size: 44px;
      line-height: 50px;
    }
  }

  @media (min-width: 768px) {
    h1 {
      font-size: 64px;
      line-height: 68px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn {
      transition: none;
    }

    .btn:active {
      transform: none;
    }
  }
</style>
</head>
<body>
<header>
  <img class="wordmark" src="./assets/centuris-wordmark-on-dark.svg" width="240" height="20" alt="Centuris Capital">
</header>
<main>
  <h1>Bozeman&nbsp;Capital Partners is&nbsp;now Centuris&nbsp;Capital</h1>
  <p>Our name has changed. Our website has moved to centuriscapital.com.</p>
  <div class="actions">
    <a class="btn" href="https://centuriscapital.com">Go to centuriscapital.com</a>
    <p class="countdown" role="timer">Redirecting in <span id="seconds">10</span> <span id="unit">seconds</span></p>
  </div>
</main>
<script>
  (function () {
    var TARGET = 'https://centuriscapital.com';
    var DURATION_MS = 10000;
    var seconds = document.getElementById('seconds');
    var unit = document.getElementById('unit');
    var deadline;

    function tick() {
      var remaining = Math.ceil((deadline - Date.now()) / 1000);
      if (remaining <= 0) {
        // replace, so the back button skips this page instead of redirecting again
        window.location.replace(TARGET);
        return;
      }
      seconds.textContent = remaining;
      unit.textContent = remaining === 1 ? 'second' : 'seconds';
    }

    function start() {
      deadline = Date.now() + DURATION_MS;
      tick();
    }

    start();
    setInterval(tick, 250);

    // Coming back from the back/forward cache restarts the countdown
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) start();
    });
  })();
</script>
</body>
</html>
